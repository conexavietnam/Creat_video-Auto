name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Chuẩn bị SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Đẩy mã lên VPS
        env:
          RELEASE: ${{ github.sha }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes"
          TARGET="$VPS_USER@$VPS_HOST"
          $SSH "$TARGET" "mkdir -p ~/releases/$RELEASE"
          rsync -az --delete -e "$SSH" \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude '.data' --exclude '.env*' \
            ./ "$TARGET:releases/$RELEASE/"

      - name: Cài đặt và khởi động lại
        env:
          RELEASE: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash ~/releases/$RELEASE/deploy/remote-release.sh $RELEASE"

      - name: Kiểm tra trang chạy
        run: |
          for i in $(seq 1 15); do
            if curl -fsS https://video.vaway.vn/api/auth/status; then exit 0; fi
            sleep 4
          done
          echo "video.vaway.vn không phản hồi" >&2
          exit 1
